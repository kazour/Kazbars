repos:
  # Linter only. The formatter (ruff-format) is intentionally omitted: this
  # codebase is single-quote style and was never `ruff format`-ed, and the
  # configured quote-style="double" would rewrite nearly every file. Re-add
  # `- id: ruff-format` deliberately if the team adopts a formatting standard.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: db-changelog
        name: buff DB edits ship with their changelog entry
        entry: python scripts/check_db_changelog.py
        language: system
        files: ^src/kazbars/assets/kazbars/Database\.json$
        pass_filenames: false

      - id: pytest-smoke
        name: pytest smoke tests
        entry: pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
