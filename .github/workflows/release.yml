name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra build

      - name: Build
        run: uv run pyinstaller kazbars.spec

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY.md -Destination "dist/KazBars"
          Push-Location dist   # 7-Zip stores paths as given: entries must start at KazBars/
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx9 -mfb=258 -mpass=15 ../KazBars.zip KazBars
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "KazBars.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  KazBars.zip" | Out-File -Encoding ascii -NoNewline "KazBars.zip.sha256"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: KazBars ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            KazBars.zip
            KazBars.zip.sha256
